services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbitragem}
      POSTGRES_USER: ${POSTGRES_USER:-arbitragem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbitragem} -d ${POSTGRES_DB:-arbitragem}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  arbitragem:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arbitragem}:${POSTGRES_PASSWORD:-change-this-password}@database:5432/${POSTGRES_DB:-arbitragem}
      APP_ENV: ${APP_ENV:-production}
      AUTH_REQUIRED: "true"
      # Os documentos precisam viver no volume; o filesystem do container é
      # descartado a cada restart.
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-local}
      DOCUMENT_STORAGE_DIR: /app/data/documents
    volumes:
      - app_data:/app/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
