services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbitragem}
      POSTGRES_USER: ${POSTGRES_USER:-arbitragem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbitragem} -d ${POSTGRES_DB:-arbitragem}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  arbitragem:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arbitragem}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@database:5432/${POSTGRES_DB:-arbitragem}
      APP_ENV: production
      AUTH_REQUIRED: "true"
      ALLOW_LEGACY_CASE_TOKENS: "false"
      EXPOSE_AUTH_TOKENS: "false"
      SECURE_COOKIES: "true"
      EMAIL_VERIFICATION_REQUIRED: "true"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
